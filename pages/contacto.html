<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contacto - Digital Factory</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- HEADER -->
    <header>
        <img src="../assets/img/Logo2.png" alt="Logo Digital Factory" width="200">
        <h1 class="scroll-title">Bienvenido a DIGITAL FACTORY</h1>
    </header>

    <!-- NAV -->
    <nav>
        <ul>
            <li><a href="../index.html">Inicio</a></li>
            <li><a href="servicios.html">Servicios</a></li>
            <li><a href="equipo.html">Equipo</a></li>

        </ul>
    </nav>

    <!-- MAIN -->
    <main>
        <section>
            <h2>Formulario de Contacto</h2>

            <form>

                <label for="nombre">Nombre:</label><br>
                <input type="text" id="nombre" name="nombre" required>
                <br><br>

                <label for="apellido">Apellido:</label><br>
                <input type="text" id="apellido" name="apellido" required>
                <br><br>

                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" required>
                <br><br>

                <label for="mensaje">Mensaje:</label><br>
                <textarea id="mensaje" name="mensaje" rows="5" cols="40" required></textarea>
                <br><br>

                <input type="submit" value="Enviar">
                <input type="reset" value="Limpiar">

            </form>
        </section>
    </main>

    <!-- FOOTER -->
    <footer>
        <p>© 2026 Digital Factory. Todos los derechos reservados.</p>
        <p>Contacto: <a href="mailto:contacto@digitalfactory.com">contacto@digitalfactory.com</a></p>
    </footer>

</body>
</html>
