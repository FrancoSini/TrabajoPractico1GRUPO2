<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pedido de Servicio - Digital Factory</title>
    <link rel="stylesheet" href="../css/style.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }

        .form-contenedor {
            max-width: 500px;
            margin: 40px auto;
            padding: 25px;
            background-color: #18196f; /* azul */
            color: #ffffff;
            border-radius: 10px;
            box-shadow: 0px 4px 12px rgba(0,0,0,0.2);
            text-align: center;
        }

        .form-contenedor h2 {
            margin-bottom: 20px;
        }

        form {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        form label {
            margin-top: 10px;
            color: #ffffff;
        }

        form input, form select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 5px;
            border: none;
        }

        .botones {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
        }

        input[type="submit"], input[type="reset"] {
            width: 48%;
            cursor: pointer;
            background-color: #0056b3;
            color: white;
        }

        input[type="submit"]:hover,
        input[type="reset"]:hover {
            background-color: #003f80;
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header>
        <img src="../assets/img/Logo2.png" alt="Logo Digital Factory" width="200">
        <h1 class="scroll-title">Bienvenido a DIGITAL FACTORY</h1>
    </header>

    <!-- NAV -->
    <nav>
        <ul>
            <li><a href="../index.html">Inicio</a></li>
            <li><a href="servicios.html">Servicios</a></li>
            <li><a href="equipo.html">Equipo</a></li>
            <li><a href="pedido.html">Pedido de Servicio</a></li>
            <li><a href="contacto.html">Contacto</a></li>
            <li><a href="faq.html">Preguntas Frecuentes</a></li>
        </ul>
    </nav>

    <!-- MAIN -->
    <main>
        <section>

            <div class="form-contenedor">
                <h2>Formulario para solicitar un servicio</h2>

                <form>
                    <label for="nombre">Nombre completo:</label>
                    <input type="text" id="nombre" name="nombre" required>

                    <label for="telefono">Número de teléfono:</label>
                    <input type="text" id="telefono" name="telefono" required>

                    <label for="servicio">Ingrese el tipo de servicio que solicita:</label>                             
                    <select name="opciones" id="opciones">
                        <option value="opcion1">Mantenimiento</option>
                        <option value="opcion2">Desarrollo y transformación digital</option>
                        <option value="opcion3">Consultoria</option>
                    </select>  

                    <label for="fecha">Selecciona la fecha estimativa en que desea el servicio:</label>
                    <input type="date" id="fecha" name="fecha">

                    <label for="especificaciones">Especificaciones:</label>
                    <input type="text" id="especificaciones" name="especificaciones" required>

                    <div class="botones">
                        <input type="submit" value="Enviar">
                        <input type="reset" value="Limpiar">
                    </div>
                </form>
            </div>

        </section>
    </main>

    <!-- FOOTER -->
    <footer>
        <p>© 2026 Digital Factory. Todos los derechos reservados.</p>
        <p>Contacto: <a href="mailto:contacto@digitalfactory.com">contacto@digitalfactory.com</a></p>
    </footer>

</body>
</html>
